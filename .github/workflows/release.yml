# Triggered on push to master; runs CI gates, then either opens a "Release
# packages" PR (when there are pending changesets) or publishes to npm
# (when the version PR was just merged). Auth via npm Trusted Publishing
# (OIDC) — `id-token: write` permission below + Trusted Publisher configured
# on each package in the npmjs.com UI. No `NPM_TOKEN` secret required.
name: Release

on:
  push:
    branches: [master]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'hacker-cb/1c-odata'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write   # for npm provenance
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Same pnpm/Node/install boilerplate as every ci.yml job. The action
      # sets no registry-url, which is what Trusted Publishing needs here:
      # setup-node only uses registry-url to write a placeholder .npmrc with
      # `_authToken=${NODE_AUTH_TOKEN}` (the legacy NPM_TOKEN path), while the
      # OIDC token is fetched directly by `npm publish` via the
      # `id-token: write` permission — no .npmrc auth needed.
      - uses: ./.github/actions/setup
      # Same gate sequence as ci.yml, shared via ./.github/actions/gates (each
      # gate is a separate turbo invocation — the action documents why). Typecheck
      # stays inline here because ci.yml runs it in a separate matrix job.
      - name: Typecheck (gate 1)
        run: pnpm turbo typecheck --filter='./packages/*'
      - name: Build & test gates (2-5)
        uses: ./.github/actions/gates
      # npm Trusted Publishing (OIDC) requires npm >= 11.5.1. Node 22 LTS
      # ships with npm 10.9.x, which falls back to legacy auth and fails with
      # ENEEDAUTH on `npm publish`.
      #
      # In-place self-upgrade (`npm i -g npm@latest`, even with `--force`)
      # blows up with MODULE_NOT_FOUND because the old client unlinks bundled
      # deps that its own rebuild step still requires. Install the new client
      # into a separate prefix instead and prepend it to PATH via
      # $GITHUB_PATH — the system npm stays untouched.
      - name: Install npm@latest for Trusted Publishing
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/npm-latest" npm@latest --no-fund --no-audit --silent
          echo "$RUNNER_TEMP/npm-latest/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Verify npm version
        run: npm --version
      # Action handles version-bump PR creation only. Publishing is done in
      # a separate step below so npm CLI gets OIDC env vars directly from the
      # GitHub Actions runner — `pnpm changeset publish` was reliably losing
      # them on the way to `npm publish` (ENEEDAUTH despite npm 11+ and a
      # configured Trusted Publisher).
      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          commit: 'chore: release packages'
          title: 'chore: release packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish unpublished packages to npm (OIDC Trusted Publishing)
        # hasChangesets=='false' covers BOTH "the release PR was just merged"
        # (versions bumped → publish) and "this master push had no pending
        # changesets at all" (e.g. a docs/chore merge). The per-package `npm view`
        # check below keeps the step idempotent: only versions not already on npm
        # are published, so the no-release case is a safe no-op.
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          set -euo pipefail
          for dir in packages/*/; do
            pkg=$(node -p "require('./${dir}package.json').name")
            ver=$(node -p "require('./${dir}package.json').version")
            priv=$(node -p "require('./${dir}package.json').private || false")
            if [ "$priv" = "true" ]; then
              echo "skip $pkg (private)"
              continue
            fi
            published=$(npm view "$pkg@$ver" version 2>/dev/null || true)
            if [ -n "$published" ]; then
              echo "already on npm: $pkg@$ver"
              continue
            fi
            echo "publishing $pkg@$ver"
            ( cd "$dir" && npm publish --provenance --access public )
          done
          # Tag the release commit. The packages are a changesets `fixed` group
          # (always identical versions), so a single `v<version>` tag is
          # unambiguous. Create it whenever the current published version has no
          # tag yet — idempotent and self-healing if an earlier push failed.
          version=$(node -p "require('./packages/client/package.json').version")
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "tag v$version already exists — skipping"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "v$version" -m "v$version"
            git push origin "v$version"
            echo "tagged release v$version"
          fi
      # changesets/action's `title` input is a static string evaluated before
      # `changeset version` runs, so the new version isn't yet known there.
      # Read it from the just-pushed release branch and rewrite the PR title.
      # Skipped on publish runs (no PR exists) and when there's nothing to release.
      # @1c-odata/client, @1c-odata/metadata and @1c-odata/cli are a changesets
      # `fixed` group in .changeset/config.json (one shared version), so reading
      # the client version is sufficient.
      - name: Rewrite Release PR title with version
        if: steps.changesets.outputs.hasChangesets == 'true' && steps.changesets.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ steps.changesets.outputs.pullRequestNumber }}
        run: |
          set -euo pipefail
          if [ -z "$PR_NUM" ]; then exit 0; fi
          VERSION=$(gh api "repos/${{ github.repository }}/contents/packages/client/package.json?ref=changeset-release/master" --jq '.content' | base64 -d | jq -r '.version')
          gh pr edit "$PR_NUM" --title "chore(release): v${VERSION}"
