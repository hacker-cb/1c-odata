name: CI

on:
  # Gate every PR regardless of base — no base-branch allow-list. A multi-PR
  # feature's slice PRs target their `umbrella/**` branch, not the trunk, so a
  # `branches: [master]` filter would silently skip them (see
  # .claude/rules/git-branches.md § Recommended CI triggers), yet the branch
  # ruleset still requires these checks there. `workflow_dispatch` allows manual
  # re-runs (flaky CI / on-demand).
  pull_request:
  workflow_dispatch:

# CI validates pull requests against any base. Pushes to master are handled by
# release.yml, which re-runs typecheck plus the core build/test gates (Ubuntu
# only) before any publish — not the full PR matrix here (no Biome lint, no
# Windows leg, no live tests), since every change reaches master through a PR
# that already ran this workflow in full. The changesets release PR is a normal
# PR, covered here too.

# One in-flight run per PR ref: a new push to a PR branch (arriving as
# `pull_request: synchronize`) cancels the previous run for that PR. Different
# PRs stay independent because `github.ref` is part of the group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Workflow-default permissions — read-only. No job here writes via the
# GITHUB_TOKEN (no PR comments, no releases, no push). Tighten the default
# instead of leaving the per-repo dashboard default at read/write.
permissions:
  contents: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  detect-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # Owner-only: forks (and any other-owner mirrors) skip this job and every
    # downstream job that depends on it. Live/write tests run against private
    # 1С bases — secrets must never be exposed off the canonical repo.
    #
    # Three-part gate:
    #   1. `repository_owner == 'hacker-cb'` excludes runs in other-owner
    #      mirrors entirely.
    #   2. Dependabot-triggered runs receive Dependabot secrets, NOT Actions
    #      secrets, so the 5-secret check below would fail red on every
    #      Dependabot PR. Skipping here cascades to the live/write/example
    #      jobs via their `needs` edges — the same degraded-but-green
    #      treatment fork PRs get. A human pushing to the bot's branch
    #      re-enables the full pipeline (the actor becomes the human, and
    #      Actions secrets are available again).
    #   3. For `pull_request` events `repository_owner` reflects the BASE
    #      repo (hacker-cb), not the fork — so part 1 alone would still
    #      run on fork PRs. Comparing `head.repo.full_name` to
    #      `github.repository` is the canonical pattern for skipping
    #      fork PRs while keeping owner-internal PRs covered. This workflow
    #      only runs on `pull_request`, so the comparison is always defined.
    if: |
      github.repository_owner == 'hacker-cb' &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      allow-writes: ${{ steps.check.outputs.allow-writes }}
    steps:
      - id: check
        env:
          ONEC_TRADE_V11_5_URL: ${{ secrets.ONEC_TRADE_V11_5_URL }}
          ONEC_BP_V3_0_URL: ${{ secrets.ONEC_BP_V3_0_URL }}
          ONEC_EXAMPLE_BASIC_URL: ${{ secrets.ONEC_EXAMPLE_BASIC_URL }}
          HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
          ONEC_TESTS_ALLOW_WRITES: ${{ secrets.ONEC_TESTS_ALLOW_WRITES }}
        run: |
          # All 5 secrets must be configured on the canonical repo. If anything
          # is missing the job fails loudly with the list of missing names —
          # silent skip (the previous has-fixtures=no path) hides genuine
          # mis-configuration as a green CI run.
          missing=()
          [ -z "$ONEC_TRADE_V11_5_URL" ]   && missing+=("ONEC_TRADE_V11_5_URL")
          [ -z "$ONEC_BP_V3_0_URL" ]       && missing+=("ONEC_BP_V3_0_URL")
          [ -z "$ONEC_EXAMPLE_BASIC_URL" ] && missing+=("ONEC_EXAMPLE_BASIC_URL")
          [ -z "$HTTP_PROXY" ]             && missing+=("HTTP_PROXY")
          [ -z "$ONEC_TESTS_ALLOW_WRITES" ] && missing+=("ONEC_TESTS_ALLOW_WRITES")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required repository secrets: ${missing[*]}"
            exit 1
          fi
          # Sentinel `yes`/`no` (not `true`/`false`) — GitHub masks any value
          # equal to a registered secret, and `ONEC_TESTS_ALLOW_WRITES=true`
          # would cause the literal string `true` to be redacted from step
          # outputs, breaking downstream `if:` predicates.
          if [ "$ONEC_TESTS_ALLOW_WRITES" = "true" ]; then
            echo "allow-writes=yes" >> "$GITHUB_OUTPUT"
          else
            echo "allow-writes=no" >> "$GITHUB_OUTPUT"
          fi

  lint-and-typecheck:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Lint (gate 1)
        run: pnpm biome ci .
      - name: Typecheck (gate 2)
        run: pnpm turbo typecheck --filter='./packages/*'
      - name: Typecheck examples offline (gate 2b)
        # Examples are otherwise typechecked only inside the owner-gated
        # test-example job (it needs live secrets) — fork PRs would skip them
        # entirely. Both examples typecheck offline: dynamic needs no codegen
        # at all, basic regenerates from its committed metadata/default.xml.
        # Ubuntu-only: tsc over thousands of generated files is slow on the
        # Windows runner (NTFS), and type results are OS-independent.
        if: matrix.os == 'ubuntu-latest'
        run: |
          pnpm --filter basic-example typecheck
          pnpm --filter dynamic-example typecheck
      - name: Auth schema + drizzle migrations re-derive clean (gate 2c)
        # Both generated-and-committed artifacts must reproduce from their inputs:
        #   auth.config.ts --(@better-auth/cli)--> auth-schema.ts --(drizzle-kit)--> drizzle/*.sql
        # drizzle/*.sql is the SINGLE source of truth applied at runtime by BOTH
        # dev/tests (pglite) and prod (pg) — see src/store/migrate.ts — so a stale
        # committed SQL would only surface as a prod boot failure otherwise.
        #
        # This INVOKES the package's own `auth:schema` script rather than
        # re-implementing a stage. The original defect was exactly a gate that ran
        # `drizzle-kit generate` directly and skipped stage 1: the one command that
        # would have exercised the (broken) generator was routed around, so the gate
        # stayed green while `auth:schema` — the command its own error message tells
        # you to run — could not run at all. A gate that runs the documented command
        # cannot drift from the docs. Ubuntu-only — deterministic, OS-independent.
        if: matrix.os == 'ubuntu-latest'
        run: |
          # stdin from /dev/null covers BOTH generators in the script. `better-auth
          # generate` would prompt before overwriting auth-schema.ts, which the
          # script's `--yes` suppresses; `drizzle-kit generate` prompts only on an
          # ambiguous rename. With no TTY either read gets EOF and fails fast
          # instead of hanging to the job timeout. The common add/modify drift case
          # (what this guard targets) never prompts.
          pnpm -F @1c-odata/mcp-server auth:schema < /dev/null
          if [ -n "$(git status --porcelain packages/mcp-server/auth-schema.ts packages/mcp-server/drizzle)" ]; then
            echo "::error::auth schema / drizzle migrations out of sync — run 'pnpm -F @1c-odata/mcp-server auth:schema' and commit packages/mcp-server/{auth-schema.ts,drizzle}"
            git status --porcelain packages/mcp-server/auth-schema.ts packages/mcp-server/drizzle
            git --no-pager diff packages/mcp-server/auth-schema.ts packages/mcp-server/drizzle
            exit 1
          fi

  test-and-build:
    runs-on: ${{ matrix.os }}
    needs: lint-and-typecheck
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build & test gates (3-6)
        uses: ./.github/actions/gates
        with:
          # Coverage only on Linux — the upload step below is ubuntu-only, so
          # instrumenting on Windows would be wasted work. Renders to the
          # string 'true'/'false' the composite compares against.
          coverage: ${{ matrix.os == 'ubuntu-latest' }}
      - name: E2E tests (gate 8)
        run: pnpm turbo test:e2e --filter='./packages/*'
      - name: mcp-server bin boots on Windows (gate 8b)
        # The Linux deploy tiers (deploy-pg-smoke / deploy-package-smoke) never run
        # on Windows, yet the bin's OS-sensitive bits regress on NTFS: the shebang +
        # realpathSync entry guard, and migrationsFolder()'s dirname/join walk over
        # backslash paths. admin-create exercises exactly those — it drives
        # runAuthMigrations from the built dist against a throwaway pglite store,
        # with NO port bind (so no server/curl flake). `gates` already built dist/.
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          BETTER_AUTH_SECRET: ci-windows-secret-not-for-prod-0123456789
        run: |
          node packages/mcp-server/dist/cli.js --help | grep -q admin-create
          node packages/mcp-server/dist/cli.js admin-create \
            --auth-data-dir "$RUNNER_TEMP/mcp-store" --public-url http://127.0.0.1:3000 \
            --email a@b.co --password 'Password123!' | grep -qi 'admin user created'
      - name: Upload coverage
        if: success() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: packages/*/coverage/
          # Fail loudly if coverage vanished — a silent empty upload previously
          # masked the fact that coverage was never generated at all.
          if-no-files-found: error

  deploy-pg-smoke:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    timeout-minutes: 10
    # Boots the shipped `pnpm deploy --prod` tree against a REAL Postgres and walks
    # the deploy paths the pglite unit/e2e suite structurally cannot: the
    # node-postgres migrator, the setup token's single-use guarantee under TRUE
    # concurrency (pglite serializes; a prod pg.Pool does not), the Host guard
    # end-to-end, and SIGTERM + idempotent re-migration.
    #
    # SECRET-FREE by construction: a throwaway `services:` Postgres + app secrets
    # from `openssl rand`; no 1С base, no proxy. => NO `needs: detect-secrets`; runs
    # on fork PRs; CAN be a required check.
    # GUARDRAIL: never add any `secrets.*` here — that demands the owner gate and
    # forfeits fork coverage. A secret-bearing deploy variant belongs in its own file.
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: mcp
          POSTGRES_PASSWORD: mcp
          POSTGRES_DB: mcp
        ports:
          - 5433:5432 # host 5433 dodges any preinstalled pg on 5432
        options: >-
          --health-cmd "pg_isready -U mcp -d mcp"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Emit the --prod deploy tree
        run: pnpm --filter @1c-odata/mcp-server deploy --prod --legacy /tmp/app
      - name: Boot on real pg + walk security-critical paths
        env:
          APP_DIR: /tmp/app
          DATABASE_URL: postgres://mcp:mcp@127.0.0.1:5433/mcp
          ONEC_MCP_PUBLIC_URL: http://127.0.0.1:3000
        run: bash packages/mcp-server/deploy/ci/smoke.sh
      - name: Dump server logs on failure
        if: failure()
        # Redact the first-run setup token: a failure BEFORE the race consumes it
        # would otherwise print a still-live one-time token into the CI log.
        run: cat /tmp/mcp1.log /tmp/mcp2.log 2>/dev/null | sed -E 's/token=[A-Za-z0-9_-]+/token=REDACTED/g' || true

  deploy-package-smoke:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    timeout-minutes: 10
    # Sole owner of the published-package path: pack the four @1c-odata/* tarballs,
    # install them into a scratch project (pinned to the local tarballs so npm never
    # hits the registry for the unpublished siblings), and drive the AUTH path so
    # the migrator resolves `drizzle/` from the real node_modules layout. Catches a
    # dropped `files` entry / broken `bin` / misfiled runtime dep that `package:lint`
    # (types + exports only) cannot. Secret-free; fork-safe.
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Pack + install the tarball, boot the bin
        env:
          REPO: ${{ github.workspace }}
          TMP: ${{ runner.temp }}/pkgsmoke
        run: bash packages/mcp-server/deploy/ci/package-smoke.sh
      - name: Dump boot log on failure
        if: failure()
        run: cat "${{ runner.temp }}/pkgsmoke/pk.log" 2>/dev/null || true

  test-example:
    runs-on: ubuntu-latest
    needs: [detect-secrets, test-and-build]
    timeout-minutes: 10
    # End-to-end smoke test of the example consumer flow against a live 1С
    # base. Covers what `turbo typecheck` cannot from committed metadata:
    #   - `1c-odata fetch` round-trip (CLI network path, auth, proxy).
    #   - `pnpm demo` runtime (generated types compile AND work against a
    #     real API: transport, filter API, streaming, etc).
    # Owner-only gate inherited via `needs: detect-secrets` (ONEC_EXAMPLE_BASIC_URL
    # carries embedded credentials).
    #
    # NODE_OPTIONS=--import=.ci/proxy-init.mjs is set per-step (not
    # job-level) — job-level env applies to actions/checkout@v7 which runs
    # Node before the workspace is checked out, so the preload file
    # doesn't exist yet and Node fails with ERR_MODULE_NOT_FOUND.
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Fetch live metadata (gate 10a)
        # Overwrites the committed metadata/default.xml snapshot (full ~15 MB,
        # used for offline demos/typecheck) with fresh $metadata from the live
        # base. Exercises the CLI network/auth path.
        # `pnpm run fetch` (not bare `pnpm fetch`) — the latter invokes
        # pnpm's built-in fetch command, not the package.json script.
        run: pnpm --filter basic-example run fetch
        env:
          ONEC_EXAMPLE_BASIC_URL: ${{ secrets.ONEC_EXAMPLE_BASIC_URL }}
          HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
          # Production runtime has no per-client proxy support — undici is
          # configured process-wide. .ci/proxy-init.mjs sets up the global
          # dispatcher when HTTP_PROXY is present, matching the test-only
          # pattern in packages/client/test/setup.ts.
          NODE_OPTIONS: --import=${{ github.workspace }}/.ci/proxy-init.mjs
      - name: Typecheck example against fresh metadata (gate 10b)
        # Re-runs codegen via `pretypecheck` against the just-fetched
        # metadata, then `tsc --noEmit`. Offline, but uses the live shape.
        run: pnpm --filter basic-example typecheck
      - name: Run demo against live base (gate 10c)
        run: pnpm --filter basic-example run demo
        env:
          ONEC_EXAMPLE_BASIC_URL: ${{ secrets.ONEC_EXAMPLE_BASIC_URL }}
          HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
          NODE_OPTIONS: --import=${{ github.workspace }}/.ci/proxy-init.mjs
      - name: Typecheck dynamic example (gate 10d)
        # No codegen step at all — that's the point of the example. Offline.
        run: pnpm --filter dynamic-example typecheck
      - name: Run dynamic demo against live base (gate 10e)
        # No-codegen runtime path end-to-end: createDynamicClient fetches
        # $metadata, builds the index, and queries the same live base
        # (reusing the basic-example secret under the example's own var).
        run: pnpm --filter dynamic-example run demo
        env:
          ONEC_EXAMPLE_DYNAMIC_URL: ${{ secrets.ONEC_EXAMPLE_BASIC_URL }}
          HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
          NODE_OPTIONS: --import=${{ github.workspace }}/.ci/proxy-init.mjs

  test-live:
    runs-on: ubuntu-latest
    needs: [detect-secrets, test-and-build]
    timeout-minutes: 10
    # detect-secrets runs only on the canonical repo and verifies all 5
    # secrets are present, so the fact that this job has detect-secrets in
    # its `needs` is sufficient gating — if detect-secrets skipped (fork)
    # or failed (missing secret), this job is automatically skipped too.
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Generate example types (needed by enum-roundtrip live test)
        # `packages/client/test/integration/live/enum-roundtrip.test.ts` loads
        # `examples/basic/generated/default/__metadata.json` to source the
        # canonical enum member list, then asserts live wire values fall
        # inside it. `examples/basic/generated/` is gitignored, and `test-live`
        # runs in its own fresh checkout (no shared workspace with
        # `test-example`), so without this step the test silently skips via
        # `it.skipIf(!existsSync(METADATA_PATH))` and the regression goes
        # unexercised. `generate` is fully offline (reads committed
        # `metadata/default.xml`), so it's safe to do before `test:integration:live`.
        run: pnpm --filter basic-example run generate
      - name: Live integration tests (gate 7)
        run: pnpm turbo test:integration:live --filter='./packages/*'
        env:
          ONEC_TRADE_V11_5_URL: ${{ secrets.ONEC_TRADE_V11_5_URL }}
          ONEC_BP_V3_0_URL: ${{ secrets.ONEC_BP_V3_0_URL }}
          HTTP_PROXY: ${{ secrets.HTTP_PROXY }}

  test-write:
    runs-on: ubuntu-latest
    needs: [detect-secrets, test-live]
    timeout-minutes: 10
    # `allow-writes` is the explicit feature flag (set ONEC_TESTS_ALLOW_WRITES=true
    # in repo secrets to opt in). Owner-only restriction is inherited via the
    # detect-secrets dependency.
    #
    # WARNING for future maintainers: do NOT add a new job that uses `secrets.*`
    # in its `env:` block without putting `detect-secrets` (or another
    # owner-gated job) in its `needs:`. The owner-only fork protection in this
    # workflow lives ONLY in the `if:` on `detect-secrets` — every secret-bearing
    # job inherits the gate via the needs-edge. A new job with `secrets.*` and
    # no needs-edge to an owner-gated job would expose secrets to fork PRs.
    if: needs.detect-secrets.outputs.allow-writes == 'yes'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Generate example types (needed by enum-roundtrip live test)
        # `test:integration:write` turbo-depends on `test:integration:live`, which
        # includes the enum-roundtrip live test that loads
        # `examples/basic/generated/default/__metadata.json`. `examples/basic/generated/`
        # is gitignored and `test-write` runs in its own fresh checkout (no
        # shared workspace with `test-live`), so the fixture must be regenerated
        # here too. Offline; reads committed `metadata/default.xml`.
        run: pnpm --filter basic-example run generate
      - name: Write integration tests (gate 9)
        run: pnpm turbo test:integration:write --filter='./packages/*'
        env:
          ONEC_TESTS_ALLOW_WRITES: 'true'
          ONEC_TRADE_V11_5_URL: ${{ secrets.ONEC_TRADE_V11_5_URL }}
          ONEC_BP_V3_0_URL: ${{ secrets.ONEC_BP_V3_0_URL }}
          HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
