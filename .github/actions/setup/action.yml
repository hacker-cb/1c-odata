name: Setup
description: Install pnpm, set up Node from .nvmrc with pnpm cache, and run `pnpm install --frozen-lockfile`.

# Composite action — extracted from the 4-step boilerplate that was repeated in
# every CI job. Centralises Node version, install flags, and the pnpm cache
# config in one place. Callers still need `actions/checkout@v7` as their FIRST
# step (the workflow checkout must produce this action's file on disk before
# `uses: ./.github/actions/setup` can resolve).
#
# The Node version comes from `.nvmrc` rather than a literal here, so CI, local
# development and the engines floor cannot drift apart: one file to edit when
# the supported line moves. Keep .nvmrc in step with the `engines.node` floor
# in every package.json — that pairing is what makes the advertised minimum an
# actually-tested claim rather than a promise.
#
# Since setup-node v6, automatic caching covers npm only — the explicit
# `cache: pnpm` below is load-bearing, don't drop it.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - name: Install
      shell: bash
      run: pnpm install --frozen-lockfile
